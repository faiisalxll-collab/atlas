name: Import ATLAS ZIP (one time)
on:
  push:
    branches: [main]
    paths:
      - 'atlas-reviewed.zip'
      - '.github/workflows/import-atlas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract ATLAS source
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path('atlas-reviewed.zip')
          if not archive.exists():
              raise SystemExit('Missing atlas-reviewed.zip in repository root')
          with ZipFile(archive) as z:
              items = [i for i in z.infolist() if not i.is_dir()]
              if not items or len(items) > 500:
                  raise SystemExit('Unexpected archive contents')
              for info in items:
                  p = PurePosixPath(info.filename)
                  if not p.parts or p.parts[0] != 'atlas' or len(p.parts) < 2 or '..' in p.parts:
                      raise SystemExit(f'Invalid archive path: {info.filename}')
                  if info.file_size > 5_000_000:
                      raise SystemExit(f'Archive member too large: {info.filename}')
                  destination = Path(*p.parts[1:])
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(z.read(info))
          archive.unlink()
          PY
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/sync-and-deploy.yml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "feat: import ATLAS application source"
            git push origin HEAD:main
          fi
