name: Build and deploy ATLAS
on:
  push:
    branches: [main]
    paths-ignore:
      - 'atlas-reviewed.zip'
  schedule:
    - cron: '25 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Refresh official catalog
        run: |
          python -m pip install openpyxl==3.1.5
          python scripts/sync.py
      - run: npm test
      - name: Typecheck and build
        run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/browser-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-dist
          path: dist
          retention-days: 1
  deploy:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: atlas-dist
          path: dist
      - name: Publish tested files to the Pages source
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.nojekyll' dist/ site/
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish tested ATLAS build from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
      - name: Request Pages build and verify deployed catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          for attempt in {1..40}; do
            if curl --fail --silent --location "https://faiisalxll-collab.github.io/atlas/data/metadata.json?build=$GITHUB_RUN_ID-$attempt" | cmp -s - dist/data/metadata.json; then
              exit 0
            fi
            sleep 10
          done
          exit 1
